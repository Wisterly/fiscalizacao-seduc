name: Gerar Aplicativo Android (Release APK & CI/CD)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências
        run: npm install --legacy-peer-deps || npm install

      - name: Compilar Projeto Web (Vite + TypeScript)
        run: npm run build

      - name: Sincronizar com Capacitor Android
        run: npx cap sync android

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Permissão de execução no Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Compilar APKs com numeração dinâmica via Gradle
        working-directory: ./android
        run: |
          BUILD_CODE=$(node -p "require('../version.json').buildNumber || 1")
          VERSION_NAME=$(node -p "require('../version.json').version || '1.0.0'")
          echo "Compilando Fiscal.IA com versionCode=$BUILD_CODE versionName=$VERSION_NAME"
          echo "BUILD_CODE=$BUILD_CODE" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          ./gradlew assembleDebug -PversionCode=$BUILD_CODE -PversionName="$VERSION_NAME"
          cp app/build/outputs/apk/debug/app-debug.apk ../Fiscal.IA.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../app-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../Fiscal.IA-${VERSION_NAME}.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../Fiscal.IA-v${BUILD_CODE}.apk

      - name: Disponibilizar APK como Artifact no Actions
        uses: actions/upload-artifact@v4
        with:
          name: Fiscal.IA-APK
          path: |
            Fiscal.IA*.apk
            app-release.apk
          if-no-files-found: error

      - name: Publicar Release Oficial no GitHub com tag apk-latest
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "📱 Fiscal.IA Android v${{ env.VERSION_NAME }} (Build ${{ env.BUILD_CODE }})"
          body: |
            ### 🏛 Aplicativo Oficial Android — Fiscalização SEDUC (GPR Lab)
            - **Versão:** v${{ env.VERSION_NAME }} (Build ${{ env.BUILD_CODE }})
            - **Download Direto:** Baixe o arquivo **`Fiscal.IA.apk`** ou **`app-release.apk`** abaixo para instalar no seu celular.
            - **Auto-Atualização OTA:** O aplicativo detecta esta compilação automaticamente ao abrir e oferece atualização silenciosa com 1 clique.
            - **Plataforma:** Android Mobile-First com Safe Area, Status Bar Dark e Modo Offline-First.
          files: |
            Fiscal.IA.apk
            app-release.apk
            Fiscal.IA-*.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
